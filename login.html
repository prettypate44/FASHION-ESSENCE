<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - FASHION ESSENCE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>FASHION ESSENCE BY ENAMARA</h1><p>Admin Login</p></header>
<div class="container">
  <div class="card">
    <h3>Staff / Admin Login</h3>
    <input id="username" placeholder="Username - enamara">
    <input id="password" type="password" placeholder="Password - fashion123">
    <button onclick="login()">Login</button>
    <p id="msg" style="font-size:13px;color:red"></p>
    <p style="font-size:12px;color:#666">Only staff can sell / restock. Customers do NOT need to login.</p>
    <button class="grey" onclick="window.location.href='index.html'">Back to Shop</button>
  </div>
</div>
<script>
async function login(){
  let username = document.getElementById('username').value;
  let password = document.getElementById('password').value;
  const res = await fetch('http://localhost:5000/api/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  if(data.success){
    localStorage.setItem('admin_token', data.token);
    alert('Login successful! Welcome Enamara');
    window.location.href='index.html';
  } else {
    document.getElementById('msg').innerText = data.error;
  }
}
</script>
</body>
</html>
